[build-system]
# >=77 for PEP 639's simplified `license = "MIT"` string form used below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multillm-ensemble"
version = "0.1.0"
description = "Multi-LLM ensemble: parallel model answers, scored and synthesized into one cited result."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David" }]
keywords = ["llm", "ai", "ensemble", "openai", "gemini", "mistral", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai",
    "httpx",
    "torch",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/imredavid64-glitch/MultiLLM-AI"
Repository = "https://github.com/imredavid64-glitch/MultiLLM-AI"
Issues = "https://github.com/imredavid64-glitch/MultiLLM-AI/issues"

[project.scripts]
multillm = "ensemble_demo:main"

[tool.setuptools]
py-modules = ["ai_client", "ensemble_demo", "local_models", "token_optimizer", "prompt_router"]
packages = ["train"]

[tool.ruff]
line-length = 120
# Directory patterns only (not substrings) -- "models" here must not match
# local_models.py/eval_models.py, and neither dir has .py files anyway
# (models/ is gitignored; train/data/ holds only generated .json corpora).
exclude = ["vercel-deployment/", "/models/", "/train/data/"]

[tool.ruff.lint]
# Conservative, ruff's own long-standing default selection: pyflakes (F) plus
# the pycodestyle error subsets that catch real bugs (syntax/runtime issues),
# not style/modernization opinions (import sorting, typing.List vs list,
# blind-except, etc.) that this pre-existing codebase was never written to.
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 120
